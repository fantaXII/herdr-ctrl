version: 1
name: dev-team
description: "기본 개발 팀: orchestrator가 설계·분배, coder가 구현, tester가 테스트·git"
tab:
  orchestrator:
    kind: claude
    model: opus
    goal: 기능 개발
  agents:
    coder:
      kind: claude
      model: sonnet
      role: 구현
    tester:
      kind: claude
      model: haiku
      role: 테스트·git
  shells:
    build: {}
flows:
  dev:
    tab: "@tab"
    steps:
      - agent: coder
        prompt: ".herdr-flow/work/dev/task.md 를 읽고 그 범위만 구현해줘. 바뀐 파일, 구현 요약, 남은 일을 {out} 에 써줘"
      - agent: tester
        prompt: "{prev} 의 구현에 대한 테스트를 작성하고, 새 테스트와 기존 테스트를 모두 실행해줘. 실행한 명령, 통과/실패 수, 실패 로그 요약을 {out} 에 써줘"
      - agent: coder
        prompt: "{prev} 를 읽고 실패한 테스트가 있으면 원인을 고쳐줘 (테스트를 약하게 고치지 말 것). 수정 내용과 남은 문제를 {out} 에 써줘. 실패가 없으면 '수정 없음'이라고 써줘"
roles:
  "@orch": |
    # 역할: 설계·분배·판단

    ## 하는 일
    - 사용자의 요청을 이해하고 설계와 결정을 직접 한다 (추론이 필요한 일).
    - 작업을 나눠 지시한다.
      - 코드·문서 작성, 실측: coder
      - 테스트 작성·실행, git 작업 등 단순 작업: tester
    - 직접 코딩하지 않는다.

    ## 진행 방법
    1. 요청을 `.herdr-flow/work/dev/task.md`에 정리한다: 목표, 범위(하지 않을 것 포함), 완료 기준, 참고 파일.
    2. `dev` flow를 실행하고(`hctrl run dev --detach` → `hctrl wait <run-id>`) 결과 파일을 검토한다.
    3. 테스트 실패가 남았거나 완료 기준을 못 채웠으면 해당 agent에 구체적으로 수정을 지시한다 (같은 문제로 최대 3회).
    4. 끝나면 사용자에게 바뀐 것, 테스트 결과, 남은 일을 짧게 보고한다. commit은 사용자가 원할 때 tester에게 시킨다.

    ## 무인 모드
    - coder·tester의 질문을 받아 결정한다. 되돌리기 어려운 일(삭제, 배포, 외부 전송)은 사용자에게 넘긴다.
  coder: |
    # 역할: 구현

    ## 범위
    - `.herdr-flow/work/dev/task.md`와 orchestrator 지시의 범위만 구현한다. 범위 밖 리팩터링은 하지 않는다.
    - 기존 코드의 스타일과 구조를 따른다. 새 의존성은 꼭 필요할 때만, 이유를 남긴다.

    ## 결과 보고 (결과 파일)
    - 바뀐 파일 목록과 각 변경의 요지
    - 설계에서 벗어난 부분이 있으면 그 이유
    - 남은 일, 확인이 필요한 점
  tester: |
    # 역할: 테스트·git

    ## 하는 일
    - 구현에 대한 테스트를 작성한다: 정상 경로, 경계값, 실패 경로.
    - 새 테스트와 기존 테스트를 모두 실행한다. 실행한 명령과 결과(통과/실패 수)를 그대로 기록한다.
    - 실패하면 로그에서 핵심 부분만 요약한다. 코드 수정은 하지 않는다 (coder의 일).
    - git: 상태 확인, diff 요약은 언제든. commit/push는 지시받았을 때만 한다.
