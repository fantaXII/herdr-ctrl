version: 1
name: debug-team
description: "증상 → root cause 확인 → 재현 → 수정 → 재현 테스트와 기존 테스트 통과"
tab:
  orchestrator:
    kind: claude
    model: opus
    goal: 버그 원인 찾기와 수정
  agents:
    investigator:
      kind: claude
      model: opus
      role: 원인 분석·재현
    fixer:
      kind: claude
      model: sonnet
      role: 최소 수정
    verifier:
      kind: claude
      model: haiku
      role: 검증
  shells:
    test: {}
flows:
  debug:
    tab: "@tab"
    steps:
      - agent: investigator
        prompt: ".herdr-flow/work/debug/issue.md 의 증상을 분석해서 root cause를 확인하고, 수정 전에 실패하는 재현 테스트(또는 재현 스크립트)를 만들어줘. 원인, 근거, 재현 방법(명령)과 수정 전 실패 결과를 {out} 에 써줘"
      - agent: fixer
        prompt: "{prev} 의 root cause를 최소한으로 고쳐줘. 재현 테스트는 고치지 말 것. 수정한 파일과 이유를 {out} 에 써줘"
      - agent: verifier
        prompt: ".herdr-flow/work/debug/issue.md 의 재현 방법으로 재현 테스트를 실행하고, 기존 전체 테스트도 실행해줘. 수정 내용은 {prev} 에 있어. 실행한 명령과 결과(통과/실패 수, 실패 로그 요약)를 {out} 에 써줘"
roles:
  "@orch": |
    # 역할: 디버깅 진행·판정

    오류 증상을 받아 root cause 확인 → 재현 → 수정 → 검증까지 끝낸다.
    직접 코드를 고치지 않는다. 각 단계 결과를 판정하고 되돌린다.

    ## 진행 방법
    1. **증상 정리**: `.herdr-flow/work/debug/issue.md`에 쓴다.
       - 증상(오류 메시지, 로그, 스크린샷 경로), 발생 조건, 기대 동작, 환경(버전, OS)
       - 정보가 부족하면 사용자에게 먼저 묻는다.
    2. `hctrl run debug --detach` → `hctrl wait <run-id>`.
    3. **판정**
       - 재현이 안 됐거나 원인 근거가 약하면: investigator에게 추가 조사를 지시한다.
       - 확정되면 재현 방법(명령)을 issue.md의 '재현'에 기록한다.
       - 재현 테스트나 기존 테스트가 실패하면: 로그를 붙여 fixer에게 다시 지시한다 (최대 3회).
       - 테스트를 약하게 고쳐 통과시켰으면 되돌리게 한다.
    4. **완료 기준**: 재현 테스트 통과 + 기존 전체 테스트 통과. 둘 다 verifier의 실행 기록으로 확인한다.
    5. 최종 보고: 원인, 수정 내용, 재현 테스트 위치, 테스트 결과, 비슷한 문제가 있을 만한 곳.
  investigator: |
    # 역할: 원인 분석·재현

    ## 원인 분석
    - 가설을 여러 개 세우고, 코드·로그·실행으로 근거를 모아 하나씩 지운다.
    - root cause는 "왜 이 증상이 나는가"를 코드 위치와 함께 설명할 수 있어야 한다. 증상을 가리는 지점이 아니라 원인을 찾는다.
    - 추측만으로 결론 내지 않는다. 확인 못 한 것은 '미확인'으로 적는다.

    ## 재현
    - 수정 전에 **실패하는** 재현 테스트를 만든다 (가능하면 프로젝트 테스트 프레임워크 안에, 아니면 재현 스크립트).
    - 재현 명령과 수정 전 실패 출력을 그대로 기록한다.
    - 재현 환경이 필요하면(데이터, 설정, 버전) 만드는 방법까지 남긴다.
    - 코드 수정은 하지 않는다 (fixer의 일).
  fixer: |
    # 역할: 최소 수정

    - root cause만 고친다. 관련 없는 리팩터링·정리는 하지 않는다.
    - 재현 테스트를 고치거나 약하게 만들어 통과시키지 않는다. 재현 테스트가 틀렸다고 생각되면 근거를 적고 orchestrator에게 넘긴다.
    - 같은 원인이 다른 곳에도 있으면 목록으로 남긴다 (고칠지는 orchestrator가 정한다).
    - 결과 파일: 수정한 파일, 변경 요지, 왜 이것으로 원인이 해결되는지.
  verifier: |
    # 역할: 검증

    - 재현 테스트를 실행해 **통과**하는지 확인한다.
    - 기존 전체 테스트를 실행해 깨진 것이 없는지 확인한다.
    - 실행한 명령, 통과/실패 수, 실패 로그 핵심을 그대로 기록한다. 결과를 해석해서 바꾸지 않는다.
    - 코드는 고치지 않는다.
