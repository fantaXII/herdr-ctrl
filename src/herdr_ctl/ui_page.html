<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hctrl 설정</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #667085; --line: #dde1e7;
  --accent: #2f6fde; --accent-ink: #ffffff; --ok: #1f8a4c; --warn: #b26b00; --err: #c62f2f;
  --chip: #eef2f8; --pane: #e8eef9; --pane-orch: #dfe9ff; --pane-shell: #eef0f2;
  /* one fixed color per kind, used everywhere (nav, cards, preview, flow diagram, sample chips) */
  --orch: #7c4dff; --orch-bg: #f1ecff; --agent: #2f6fde; --agent-bg: #e9f0ff;
  --shell: #1f9a72; --shell-bg: #e4f5ee; --flow: #dd6b10; --flow-bg: #fff1e3; --dirty: #d9a400;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1c2027; --ink: #e6e9ef; --muted: #98a2b3; --line: #2e343e;
    --accent: #6c9cff; --accent-ink: #0d1220; --ok: #4cc38a; --warn: #f0b44c; --err: #ff7a7a;
    --chip: #252b35; --pane: #223047; --pane-orch: #283c63; --pane-shell: #262b33;
    --orch: #b49cff; --orch-bg: #2a2342; --agent: #7aa7ff; --agent-bg: #1d2a44;
    --shell: #5ccfa6; --shell-bg: #17312a; --flow: #ffa857; --flow-bg: #3a2817; --dirty: #f0c440;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; }
header .crumb { color: var(--muted); }
header .spacer { flex: 1; }
#updateBadge .badge { cursor: help; color: var(--accent); }
main { max-width: 1360px; margin: 0 auto; padding: 20px 16px 120px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
  margin-bottom: 16px; }
section > h2 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
section > h2 .grow { flex: 1; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 7px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--err); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.link { border: none; background: none; color: var(--accent); padding: 0; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; min-width: 0; }
textarea { width: 100%; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
label.field { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
label.field > * { color: var(--ink); font-size: 14px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--chip); }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.err { color: var(--err); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 4px 6px; }
td { padding: 4px 6px; vertical-align: middle; border-top: 1px solid var(--line); }
td input, td select { width: 100%; }
table.agents td:nth-child(1) { width: 96px; } table.agents td:nth-child(2) { width: 124px; }
table.agents td:nth-child(4) { width: 130px; } table.agents td:last-child { width: 1%; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tabchip { padding: 6px 12px; border-radius: 8px; background: var(--chip); border: 1px solid transparent; }
.tabchip.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.cols { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 300px; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.card h3 { margin: 0 0 10px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.preview { display: grid; gap: 4px; height: 170px; margin-bottom: 8px; }
.pane { border-radius: 5px; background: var(--pane); display: flex; align-items: center; justify-content: center;
  font-size: 12px; text-align: center; padding: 2px; overflow: hidden; }
.pane.orch { background: var(--pane-orch); font-weight: 600; }
.pane.shell { background: var(--pane-shell); }
.preview-title { font-size: 12px; color: var(--muted); margin: 6px 0 4px; }
.step { display: grid; grid-template-columns: 28px 110px 140px minmax(0, 1fr) auto; gap: 6px; align-items: start;
  padding: 6px 0; border-top: 1px solid var(--line); }
@media (max-width: 760px) { .step { grid-template-columns: 1fr; } }
.step .num { color: var(--muted); padding-top: 6px; }
.issues { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
  padding: 8px 20px; max-height: 30vh; overflow: auto; z-index: 5; }
.issues ul { margin: 4px 0 0; padding-left: 18px; }
.issues li.error, .ilist li.error { color: var(--err); } .issues li.warning, .ilist li.warning { color: var(--warn); }
.ilist ul { margin: 4px 0 0; padding-left: 18px; } .ilist li { overflow-wrap: anywhere; }
.mark { cursor: help; margin-left: 4px; }
.notice { padding: 10px 12px; border-radius: 8px; background: var(--chip); margin-bottom: 12px; }
.toast { position: fixed; right: 20px; top: 64px; background: var(--ink); color: var(--bg); padding: 8px 14px;
  border-radius: 8px; z-index: 20; max-width: 420px; }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink);
  width: min(720px, 94vw); }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
.hidden { display: none !important; }
/* explanations: one line under each heading, hints beside each field */
.desc { color: var(--muted); font-size: 12.5px; margin: -6px 0 12px; line-height: 1.55; }
.card > .desc { margin-top: -4px; }
code { background: var(--chip); border-radius: 4px; padding: 0 5px; font-size: 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.form { display: grid; grid-template-columns: max-content minmax(180px, 340px) minmax(0, 1fr);
  gap: 8px 14px; align-items: center; }
.form > .lab { font-weight: 600; white-space: nowrap; }
.form > .ctl { display: flex; gap: 6px 8px; align-items: center; min-width: 0; flex-wrap: wrap; }
.form > .ctl > input, .form > .ctl > select { flex: 1; width: 100%; }
.form > .hint { color: var(--muted); font-size: 12px; line-height: 1.45; }
@media (max-width: 760px) {
  .form { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .form > .hint { margin-bottom: 10px; }
}
.legend { font-size: 12px; color: var(--muted); margin: 10px 0 0; line-height: 1.7; }
.legend b { color: var(--ink); font-weight: 600; }
.card h3 .grow { flex: 1; }
.stephead { display: grid; grid-template-columns: 28px 110px 140px minmax(0, 1fr) auto; gap: 6px;
  font-size: 12px; color: var(--muted); font-weight: 600; padding: 2px 0; }
@media (max-width: 760px) { .stephead { display: none; } }
/* quick setup: segmented agent-count buttons */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: none; border-radius: 0; border-left: 1px solid var(--line); min-width: 38px; }
.seg button:first-child { border-left: none; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.ctl label.row { gap: 4px; white-space: nowrap; color: var(--ink); }
/* flow: sample cards + pipeline diagram */
.samples-box { margin-bottom: 12px; }
.samples { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.sample { display: flex; flex-direction: column; gap: 6px; text-align: left; white-space: normal; padding: 10px 12px;
  border-radius: 9px; background: var(--bg); }
.sample:hover { background: var(--chip); }
.sample-title { font-weight: 600; }
.sample-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.chip { font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line);
  border-left: 3px solid var(--accent); }
.chip.shell { border-left-color: var(--muted); background: var(--pane-shell); }
.chip-arrow { color: var(--muted); font-size: 11px; }
.sample-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.sample-add { margin-left: auto; color: var(--accent); font-weight: 600; white-space: nowrap; }
.pipe { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px; background: var(--bg);
  border-radius: 8px; margin-bottom: 8px; }
.node { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--panel);
  padding: 5px 10px; min-width: 104px; max-width: 210px; cursor: pointer; text-align: left; white-space: normal; }
.node.shell { border-left-color: var(--muted); background: var(--pane-shell); }
.node.missing { border-color: var(--err); }
.node .t { display: block; font-weight: 600; font-size: 13px; }
.node .s { display: block; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node.missing .t { color: var(--err); }
.arrow { color: var(--muted); font-size: 11px; text-align: center; line-height: 1.1; }
.arrow b { display: block; font-size: 16px; font-weight: 400; }
.arrow.cont b { letter-spacing: -2px; }
.step.flash { background: var(--chip); border-radius: 6px; }
/* ---------- layout: step navigation on the left, one view on the right ---------- */
.layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.nav { position: sticky; top: 70px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px; max-height: calc(100vh - 90px); overflow: auto; }
@media (max-width: 900px) { .nav { position: static; max-height: none; } }
.nav-group { margin-bottom: 10px; }
.nav-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; padding: 6px 6px;
  border-radius: 8px; width: 100%; border: none; background: none; text-align: left; }
.nav-head:hover { background: var(--chip); }
.nav-head.active { background: var(--chip); color: var(--accent); }
.stepno { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; flex: none; }
.nav-item { display: flex; align-items: center; gap: 6px; width: 100%; border: none; background: none; text-align: left;
  padding: 5px 8px 5px 34px; border-radius: 7px; font-size: 13px; white-space: normal; }
.nav-item:hover { background: var(--chip); }
.nav-item.active { background: var(--agent-bg); font-weight: 600; }
.nav-item .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item.add { color: var(--accent); }
.nav-legend { border-top: 1px solid var(--line); margin-top: 8px; padding: 8px 6px 2px; font-size: 12px; color: var(--muted);
  display: grid; gap: 4px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot.orch { background: var(--orch); } .dot.agent { background: var(--agent); } .dot.shell { background: var(--shell); }
.dot.flow { background: var(--flow); } .dot.err { background: var(--err); } .dot.warn { background: var(--warn); }
.dots { display: inline-flex; gap: 3px; flex: none; }
.mark { font-size: 11px; font-weight: 700; } .mark.err { color: var(--err); } .mark.warn { color: var(--warn); }
.content > section > h2 { font-size: 16px; }
.view-title { display: flex; align-items: center; gap: 10px; margin: 2px 0 14px; flex-wrap: wrap; }
.view-title h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
.view-title .grow { flex: 1; }
.wizard { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 18px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.wizard .grow { flex: 1; }
/* kind-colored cards: a colored bar + tinted heading */
.card.k { border-left: 4px solid var(--kc); padding-top: 0; overflow: hidden; }
.card.k > h3 { margin: 0 -12px 10px; padding: 9px 12px; background: var(--kbg); color: var(--ink); }
.card.k > h3 .kname { color: var(--kc); }
.k.orch { --kc: var(--orch); --kbg: var(--orch-bg); } .k.agent { --kc: var(--agent); --kbg: var(--agent-bg); }
.k.shell { --kc: var(--shell); --kbg: var(--shell-bg); } .k.flow { --kc: var(--flow); --kbg: var(--flow-bg); }
.k.base { --kc: var(--muted); --kbg: var(--chip); }
.quick { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 14px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--line); margin-bottom: 14px; }
.quick .qlab { font-weight: 700; } .quick .qhint { color: var(--muted); font-size: 12px; flex-basis: 100%; }
.quick label.row { gap: 5px; }
/* agents as cards */
.agrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.acard { border: 1px solid var(--line); border-top: 3px solid var(--agent); border-radius: 9px; padding: 8px 10px;
  background: var(--panel); display: grid; gap: 6px; }
.acard .ahead { display: flex; align-items: center; gap: 6px; }
.acard .ahead input { font-weight: 600; flex: 1; min-width: 0; }
.acard .arow { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 6px; align-items: center; font-size: 12px; }
.acard .arow > span { color: var(--muted); }
.acard .arow select, .acard .arow input { width: 100%; }
.shell-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
details.adv { border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; margin-top: 10px; }
details.adv > summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
details.adv[open] > summary { margin-bottom: 8px; }
details.adv .advsum { font-weight: 400; color: var(--orch); margin-left: 6px; }
.preview-card { position: sticky; top: 70px; }
.pane { background: var(--agent-bg); border: 1px solid var(--agent); }
.pane.orch { background: var(--orch-bg); border-color: var(--orch); }
.pane.shell { background: var(--shell-bg); border-color: var(--shell); }
.flowcard { border-left: 4px solid var(--flow); }
.flowcard > h3 { color: var(--ink); }
.node { border-left-color: var(--agent); }
.node.shell { border-left-color: var(--shell); background: var(--shell-bg); }
.chip { border-left-color: var(--agent); }
.chip.shell { border-left-color: var(--shell); background: var(--shell-bg); }
.sample { border-left: 3px solid var(--flow); }
.overview { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.ovcard { text-align: left; white-space: normal; display: grid; gap: 6px; padding: 10px 12px; border-radius: 10px; }
.ovcard .ovt { font-weight: 700; display: flex; gap: 6px; align-items: center; }
.ovcard .ovm { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--kbg); color: var(--kc); font-weight: 600; }
.badge.dirty { color: var(--dirty); }
.issues li { cursor: pointer; } .issues li:hover { text-decoration: underline; }
.issues .ihead { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
body.nohelp .desc, body.nohelp .form > .hint, body.nohelp .legend, body.nohelp .qhint { display: none; }
body.nohelp .form { grid-template-columns: max-content minmax(180px, 420px); }
@media (max-width: 760px) { body.nohelp .form { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>hctrl 설정</h1>
  <span class="crumb" id="crumb"></span>
  <span id="updateBadge"></span>
  <span class="spacer"></span>
  <span id="headerActions" class="row"></span>
</header>
<main id="app"><p class="muted">불러오는 중…</p></main>
<div class="issues hidden" id="issues"></div>
<dialog id="applyDialog">
  <h3 style="margin-top:0">실행 중인 세션에 반영</h3>
  <p class="muted small" style="margin-top:0">저장한 설정과 지금 떠 있는 창/agent의 차이입니다. 재시작하면 agent의 대화 맥락은 인수인계 파일로 넘어갑니다.</p>
  <div id="applyList"></div>
  <p class="row" style="justify-content:flex-end;margin-bottom:0">
    <button id="applyLater">나중에</button><button class="primary" id="applyNow">지금 반영</button>
  </p>
</dialog>
<dialog id="roleDialog">
  <h3 style="margin-top:0" id="roleTitle">역할</h3>
  <label class="field">한 줄 역할 (역할 파일에 저장되며 표의 '역할'보다 우선합니다)<input id="roleOne"></label>
  <p></p>
  <label class="field">상세 프롬프트 (.herdr-flow/roles/&lt;agent&gt;.md)<textarea id="roleDetail" rows="14"></textarea></label>
  <p class="row" style="justify-content:flex-end;margin-bottom:0">
    <button id="roleCancel">취소</button><button class="primary" id="roleSave">저장</button>
  </p>
</dialog>
<script>
"use strict";
// ------------------------------------------------------------------ helpers
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  let data = null;
  try { data = await r.json(); } catch (e) { data = null; }
  if (!r.ok) { const err = new Error((data && data.error) || ("HTTP " + r.status)); err.status = r.status; throw err; }
  return data;
}
function toast(msg) {
  const t = h("div", { class: "toast" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 4000);
}
const code = (t) => h("code", {}, t);
const desc = (...parts) => h("p", { class: "desc" }, ...parts);
// one form line: bold label | control | muted explanation (stacks on narrow screens)
const frow = (label, control, ...hint) => [h("span", { class: "lab" }, label),
  h("div", { class: "ctl" }, control), h("span", { class: "hint" }, ...hint)];
const clone = (x) => JSON.parse(JSON.stringify(x));
// same lists as config.py DEFAULT_ROLES / DEFAULT_AGENT_NAMES / DEFAULT_SHELL_NAME / DEFAULT_TAB_BASE (hctrl init)
const DEFAULT_ROLES = ["구현", "테스트 작성", "리뷰", "보조"];
const ROLE_NAMES = ["coder", "tester", "reviewer", "helper"];
const SHELL_BASE = "build", TAB_BASE = "work";
const PANES_PER_TAB = 4;
const NAME_RE = /^[a-z][a-z0-9_-]{0,31}$/;
const TAB_RE = /^[A-Za-z][A-Za-z0-9_-]{0,24}$/;

// -------------------------------------------------------------------- state
const S = { pending: [], mode: "launcher", cwd: "", models: null, project: null, data: null, saved: null, version: null,
            running: false, tab: null, issues: [], checkTimer: null, checkSeq: 0,
            view: "tab", adv: new Set(), issuesOpen: true,
            draftJson: null, draftAt: null, ackWarn: "[]",
            wizard: false };  // wizard: first setup (no config.yaml when opened) → step bar at the bottom  // ackWarn: warnings the user already accepted  // draft: unfinished settings kept outside config.yaml
// per-viewer convenience only: whether the long explanations are shown
function helpOn() { try { return localStorage.getItem("hctrl.help") !== "off"; } catch (e) { return true; } }
function setHelp(on) {
  try { localStorage.setItem("hctrl.help", on ? "on" : "off"); } catch (e) { /* storage may be blocked */ }
  document.body.classList.toggle("nohelp", !on);
}
document.body.classList.toggle("nohelp", !helpOn());

function dirty() { return S.data && JSON.stringify(S.data) !== JSON.stringify(S.saved); }
// differs from config.yaml AND from the draft: leaving now loses work
function unsaved() { return dirty() && JSON.stringify(S.data) !== S.draftJson; }
window.addEventListener("beforeunload", (e) => { if (unsaved()) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("hashchange", route);

async function boot() {
  try {
    const st = await api("GET", "/api/state");
    S.mode = st.mode; S.cwd = st.cwd;

// ------------------------------------------------------------------- editor
async function openProject(name) {
  if (S.project === name && S.data) { render(); return; }
  if (unsaved() && !confirm("저장하지 않은 변경이 있습니다. 버릴까요?")) return;
  $("app").replaceChildren(h("p", { class: "muted" }, "불러오는 중…"));
  try {
    const [cfg, models] = await Promise.all([api("GET", "/api/project/" + encodeURIComponent(name)),
                                            S.models ? Promise.resolve(S.models) : api("GET", "/api/models")]);
    S.models = models;
    S.project = name; S.version = cfg.version; S.running = cfg.running; S.exists = cfg.exists; S.root = cfg.root;
    if (cfg.parse_error || !cfg.data || typeof cfg.data !== "object") {
      $("app").replaceChildren(h("section", {}, h("h2", {}, name),
        h("p", { class: "notice" }, "config.yaml을 읽을 수 없습니다: " + (cfg.parse_error || "형식 오류")),
        h("p", {}, "파일을 직접 고친 뒤 새로고침하세요.")));
      return;
    }
    S.data = cfg.data; normalize(S.data); S.saved = clone(S.data);
    S.draftJson = null; S.draftAt = null;
    if (cfg.draft) {  // an unfinished draft wins over config.yaml until it is saved or discarded
      S.data = cfg.draft.data; normalize(S.data);
      S.draftJson = JSON.stringify(S.data); S.draftAt = cfg.draft.saved_at;
      toast("임시 저장본(" + (S.draftAt || "?") + ")을 불러왔습니다."
        + (cfg.draft.base !== cfg.version ? " 그 뒤에 config.yaml이 바뀌었으니 확인한 뒤 저장하세요." : ""));
    } else if (!cfg.exists) {  // starter config for a project without config.yaml: nothing to lose yet
      for (const t of Object.values(S.data.tabs)) for (const kind of ["agents", "shells"])
        for (const [n, spec] of Object.entries((t && t[kind]) || {})) if (spec && typeof spec === "object") birth(n, spec);
    }
    S.issues = cfg.issues; S.tab = Object.keys(S.data.tabs || {})[0] || null;
    S.ackWarn = cfg.exists ? warningKey(cfg.issues) : "[]";  // warnings already in the saved file
    S.wizard = !cfg.exists;  // stays on until this page leaves the project, even after [만들기]
    if (cfg.draft) runCheck();  // cfg.issues describe config.yaml, not the draft
    S.view = cfg.exists && S.tab ? "tab" : "project";
    S.pending = [];
    render();
    if (S.running && S.exists) refreshChanges(false);
  } catch (e) { $("app").replaceChildren(h("p", { class: "notice" }, e.message)); }
}

function normalize(d) {
  d.tabs = d.tabs && typeof d.tabs === "object" ? d.tabs : {};
  for (const t of Object.values(d.tabs)) {
    if (!t || typeof t !== "object") continue;
    if (t.role_update === false) t.role_update = "off";   // YAML 1.1 bare off
    if (t.unattended === false) t.unattended = "off";
    // containers the editor fills in; done before the "saved" snapshot so loading is not an edit
    if (!t.agents || typeof t.agents !== "object") t.agents = {};
    if (!t.shells || typeof t.shells !== "object") t.shells = {};
  }
  if (!d.flows || typeof d.flows !== "object") d.flows = {};
}
function forSave(d) {  // the editor's empty containers are not written to config.yaml
  const out = clone(d);
  for (const t of Object.values(out.tabs || {})) if (t && t.shells && !Object.keys(t.shells).length) delete t.shells;
  if (out.flows && !Object.keys(out.flows).length) delete out.flows;
  return out;
}

function changed() {

async function runCheck() {

    S.issues = res.issues;

}

function renderIssues() {

    S.issuesOpen ? h("ul", {}, S.issues.map((i) => h("li", { class: i.level, title: "눌러서 해당 위치로 이동", onclick: () => goIssue(i.path) },

function goIssue(path) {
  const m = String(path).match(/^(tabs|flows)\.([^.\[]+)/);
  if (m && m[1] === "tabs" && S.data.tabs[m[2]]) { S.view = "tab"; S.tab = m[2]; }
  else if (m && m[1] === "flows") { S.view = "flows"; S.flash = m[2]; }
  else S.view = "project";
  render();
}
function issuesUnder(prefix) {
  return S.issues.filter((i) => String(i.path) === prefix || String(i.path).startsWith(prefix + ".") || String(i.path).startsWith(prefix + "["));
}
const issueLine = (i) => (i.level === "error" ? "✘ " : "⚠ ") + i.path + ": " + i.message;
// ✘/⚠ next to a menu item or field; hovering shows the actual messages
function markFor(prefix) {
  const hit = issuesUnder(prefix);
  if (!hit.length) return null;
  const lvl = hit.some((i) => i.level === "error") ? "err" : "warn";
  return h("span", { class: "mark " + lvl, title: hit.map(issueLine).join("\n") }, lvl === "err" ? "✘" : "⚠");
}
// the messages themselves, for a whole tab or flow (no hovering needed)
function issueList(prefix) {
  const hit = issuesUnder(prefix);
  if (!hit.length) return null;
  return h("div", { class: "notice ilist" }, h("b", {}, "검사 결과"),
    h("ul", {}, hit.map((i) => h("li", { class: i.level }, issueLine(i)))));
}
const warningKey = (issues) => JSON.stringify(issues.filter((i) => i.level === "warning").map(issueLine));

async function save() {
  const warns = S.issues.filter((i) => i.level === "warning");
  if (warns.length && warningKey(S.issues) !== S.ackWarn) {
    const shown = warns.slice(0, 8).map(issueLine).join("\n") + (warns.length > 8 ? "\n… 외 " + (warns.length - 8) + "개" : "");
    if (!confirm("경고 " + warns.length + "개가 있습니다 (저장은 할 수 있습니다).\n\n" + shown + "\n\n그래도 저장할까요?")) {
      S.issuesOpen = true; renderIssues(); goIssue(warns[0].path); return false;
    }
  }
  try {
    const sent = clone(S.data);
    const res = await api("PUT", "/api/project/" + encodeURIComponent(S.project) + "/config", { data: forSave(sent), version: S.version });
    S.version = res.version; S.saved = sent; S.exists = true; S.issues = res.issues;
    S.ackWarn = warningKey(res.issues);
    S.draftJson = null; S.draftAt = null;  // the server removed the draft
    let msg = "저장했습니다.";
    if (res.renamed && res.renamed.length) msg += " 탭 이름 변경: " + res.renamed.join(", ") + ".";
    toast(msg);
    render();
    if (S.running) refreshChanges(true);
    return true;
  } catch (e) {
    if (e.status === 409 && confirm(e.message + "\n\n파일에서 다시 불러올까요? (화면의 변경은 사라집니다)")) {
      S.data = null; S.saved = null; openProject(S.project);
    } else if (e.status === 422) {  // the check found errors after all: keep the work as a draft
      await saveDraft(); runCheck();
    } else toast(e.message);
    return false;
  }
}
// finishing: launcher → save + open the session; running session → save (the apply window follows)
function finishLabel() {
  if (S.mode === "launcher") return (S.exists ? "저장하고" : "만들고") + " 세션 열기";
  return S.running ? "저장하고 반영" : "저장하고 마치기";
}
async function finish() {
  const errs = S.issues.filter((i) => i.level === "error");
  if (errs.length) { toast("오류 " + errs.length + "개를 먼저 고치세요: " + errs[0].message); S.issuesOpen = true; goIssue(errs[0].path); return; }
  if (dirty() || !S.exists) { if (!(await save())) return; }
  if (S.mode === "launcher") openSession(S.project);
  else if (S.running) refreshChanges(true);
  else toast("저장했습니다. 세션은 일반 터미널에서 hctrl로 여세요.");
}
// bottom step bar, first setup only: ← previous · next tab / ③ flow · finish
function wizardBar(prev, next) {

function tabSteps(tname) {

async function saveDraft() {

    const res = await api("PUT", "/api/project/" + encodeURIComponent(S.project) + "/draft", { data: sent, version: S.version });

async function discardDraft() {

    S.draftJson = null; S.draftAt = null; S.data = clone(S.saved);

// ------------------------------------------------------------- members
function allMembers(d) {
  const out = [];
  for (const [tname, t] of Object.entries(d.tabs || {})) {
    if (!t || typeof t !== "object") continue;
    if (t.orchestrator && t.orchestrator !== "none" && typeof t.orchestrator === "object")
      out.push({ name: tname.toLowerCase() + "-orch", type: "orch", tab: tname });
    for (const n of Object.keys(t.agents || {})) out.push({ name: n, type: "agent", tab: tname });
    for (const n of Object.keys(t.shells || {})) out.push({ name: n, type: "shell", tab: tname });
  }
  return out;
}
function renameKey(obj, from, to) {
  const out = {};
  for (const [k, v] of Object.entries(obj)) out[k === from ? to : k] = v;
  return out;
}
// base, base2, base3 … — the first name no agent/shell/orchestrator in the project uses (config.unique_name)
function uniqueName(base) {
  const used = new Set(allMembers(S.data).map((m) => m.name));
  if (!used.has(base)) return base;
  for (let k = 2; ; k++) if (!used.has(base + k)) return base + k;
}
// Removing members also removes the flow steps that use them (after asking); flows left empty go too.
// `asked`: the caller already confirmed (its message included stepsNote), so do not ask again.
function stepHits(names) {
  const gone = new Set(names);
  const uses = (st) => gone.has(st.agent) || gone.has(st.shell);
  const hits = Object.entries(S.data.flows || {})
    .map(([fname, f]) => [fname, ((f && f.steps) || []).filter(uses).length]).filter(([, n]) => n);
  return { uses, hits };
}
function stepsNote(names) {
  const { hits } = stepHits(names);
  return hits.length ? names.join(", ") + "을(를) 쓰는 " + hits.map(([f, n]) => "flow '" + f + "'의 단계 " + n + "개").join(", ") +
    "도 함께 삭제합니다 (단계가 남지 않는 flow는 flow째 삭제)." : "";
}
function dropSteps(names, asked = false) {
  const { uses, hits } = stepHits(names);
  if (!hits.length) return true;
  if (!asked && !confirm(stepsNote(names) + "\n계속할까요?")) return false;
  for (const [fname] of hits) {
    const f = S.data.flows[fname];
    f.steps = f.steps.filter((st) => !uses(st));
    if (!f.steps.length) delete S.data.flows[fname];
  }
  return true;
}
function renameMember(oldName, newName) {
  for (const f of Object.values(S.data.flows || {}))
    for (const st of (f && f.steps) || []) {
      if (st.agent === oldName) st.agent = newName;
      if (st.shell === oldName) st.shell = newName;
    }
}

// --------------------------------------------------------------- model UI
// kind → (provider →) model. Unknown values and "직접 입력" show a text box instead of the lists.
const typing = new WeakSet();
function modelControl(spec, onChange) {
  const kind = spec.kind || "claude";
  const value = spec.model || "";
  const providers = S.models.opencode || {};
  const toList = () => { typing.delete(spec); onChange(undefined); };
  const textBox = (placeholder, withList) => {
    const input = h("input", { value, placeholder, "aria-label": "모델" });

      h("span", { class: "muted small", style: "font-weight:400" }, "실행: ", code("hctrl run " + fname)),
      h("span", { class: "grow" }),
      h("button", { class: "danger", onclick: () => { if (confirm("flow '" + fname + "'을 삭제할까요?")) { delete d.flows[fname]; changed(); } } }, "flow 삭제")));
    card.append(renderPipe(fname, f, members));
    if (f.steps.length) card.append(h("div", { class: "stephead" }, h("span", {}, "#"), h("span", {}, "종류"),
      h("span", {}, "대상 창"), h("span", {}, "지시 (agent) / 명령 (shell)"), h("span", {})));
    f.steps.forEach((st, i) => card.append(renderStep(f, st, i, members, fname)));
    card.append(h("p", { class: "row small", style: "margin-bottom:0" },
      h("button", { onclick: () => {
        const prev = f.steps[f.steps.length - 1];
        const ag = (prev && prev.agent) || (members.find((m) => m.type === "agent") || {}).name || "";
        f.steps.push({ agent: ag, prompt: "{prev} 를 읽고 이어서 작업하세요. 요약은 {out}" }); changed(); } }, "+ 단계"),
      h("span", { class: "muted" }, "{out} = 이번 단계 결과 파일, {prev} = 직전 단계 결과 파일")));
    sec.append(card);
  }
  if (S.flash) {  // bring a just-added flow into view
    const name = S.flash; S.flash = null;
    setTimeout(() => { const el = document.getElementById("flow-" + name); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "center" }); });
  }
  const ids = Object.keys(d.tabs);
  return h("div", {}, viewTitle(3, "flow"), issueList("flows"), sec,
    wizardBar(ids.length ? { label: "탭 구성", go: () => go("tab", ids[ids.length - 1]) } : { label: "① 프로젝트", go: () => go("project") }, null));
}

// flow as a diagram: ● agent / $ shell nodes; ──▶ passes the result file on, ┄┄▶ = previous shell step may fail and continue
function renderPipe(fname, f, members) {
  const pipe = h("div", { class: "pipe", "aria-label": "flow 순서도" });
  if (!f.steps.length) { pipe.append(h("span", { class: "muted small" }, "단계가 없습니다. [+ 단계]로 추가하세요.")); return pipe; }
  const roleOf = (name) => {
    for (const t of Object.values(S.data.tabs || {})) if (t && t.agents && t.agents[name]) return t.agents[name].role;
    return null;
  };
  const short = (s, n) => { s = String(s || "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
  f.steps.forEach((st, i) => {
    if (i) {
      const prev = f.steps[i - 1];
      const cont = "shell" in prev && prev.on_fail === "continue";
      pipe.append(h("span", { class: "arrow" + (cont ? " cont" : ""), title: cont ? "앞 단계가 실패해도 계속 진행하고, 결과 파일을 넘깁니다"
        : "앞 단계의 결과 파일({prev})을 넘깁니다" + ("shell" in prev ? ". 실패하면 여기서 멈춥니다" : "") },
        h("b", {}, cont ? "┄┄▶" : "──▶"), cont ? "실패해도 계속" : "결과"));
    }
    const isShell = "shell" in st;
    const target = isShell ? st.shell : st.agent;
    const exists = members.some((m) => m.name === target && (isShell ? m.type === "shell" : m.type !== "shell"));
    // agent step: what this step asks, without the file placeholders ("{prev} 를 검토하고…" → "검토하고…")
    const gist = String(st.prompt || "").replace(/\{(prev|out)\}\s*(를|을|의|에|에서)?\s*/g, "").replace(/^읽고\s+/, "").split(/[.!?]\s/)[0];
    const sub = isShell ? (st.run ? short(st.run, 24) : "(명령 없음)") : short(gist || roleOf(target) || "(지시 없음)", 24);
    pipe.append(h("button", { class: "node" + (isShell ? " shell" : "") + (exists ? "" : " missing"),
      title: (isShell ? st.run : st.prompt) || "", onclick: () => focusStep(fname, i) },
      h("span", { class: "t" }, (i + 1) + " " + (isShell ? "$ " : "● ") + (target || "(대상 없음)") + (exists || !target ? "" : " (없음)")),
      h("span", { class: "s" }, sub || " ")));
  });
  pipe.append(h("span", { class: "muted small", style: "flex-basis:100%" },
    "● agent 단계 · $ shell 단계 · ──▶ 결과 파일 전달 · ┄┄▶ 실패해도 계속 · 단계를 누르면 아래 편집 줄로 이동"));
  return pipe;
}
function focusStep(fname, i) {
  const row = document.getElementById("step-" + fname + "-" + i);
  if (!row) return;
  if (row.scrollIntoView) row.scrollIntoView({ behavior: "smooth", block: "center" });
  row.classList.add("flash");
  setTimeout(() => row.classList.remove("flash"), 1200);
  const input = row.querySelector("textarea, input");
  if (input) input.focus({ preventScroll: true });
}

function renderStep(f, st, i, members, fname) {
  const isShell = "shell" in st;
  const pool = members.filter((m) => (isShell ? m.type === "shell" : m.type !== "shell"));
  const cur = isShell ? st.shell : st.agent;
  const typeSel = h("select", { "aria-label": "단계 종류", onchange: (e) => {
    const s = e.target.value === "shell"
      ? { shell: (members.find((m) => m.type === "shell") || {}).name || "", run: "", on_fail: "stop" }
      : { agent: (members.find((m) => m.type === "agent") || {}).name || "", prompt: "" };
    f.steps[i] = s; changed(); } },
    h("option", { value: "agent", selected: !isShell }, "agent"), h("option", { value: "shell", selected: isShell }, "shell"));
  const targetSel = h("select", { "aria-label": "대상", onchange: (e) => { if (isShell) st.shell = e.target.value; else st.agent = e.target.value; changed(); } },
    !pool.some((m) => m.name === cur) ? h("option", { value: cur || "", selected: true }, cur ? cur + " (없음)" : "(선택)") : null,
    pool.map((m) => h("option", { value: m.name, selected: m.name === cur }, m.name + " · " + m.tab)));
  const body = isShell
    ? h("div", { class: "row" }, h("input", { value: st.run || "", placeholder: "실행할 명령 (예: npm run build)", style: "flex:1", onchange: (e) => { st.run = e.target.value; changed(); } }),
        h("label", { class: "row small muted" }, "실패 시", h("select", { onchange: (e) => { st.on_fail = e.target.value; changed(); } },
          ["stop", "continue"].map((v) => h("option", { value: v, selected: v === (st.on_fail || "stop") }, v)))))
    : h("textarea", { rows: 2, value: st.prompt || "", placeholder: "지시 ({out}에 결과 요약을 쓰게 하세요)", onchange: (e) => { st.prompt = e.target.value; changed(); } });
  const move = (delta) => { const j = i + delta; if (j < 0 || j >= f.steps.length) return; [f.steps[i], f.steps[j]] = [f.steps[j], f.steps[i]]; changed(); };
  return h("div", { class: "step", id: "step-" + fname + "-" + i }, h("span", { class: "num" }, i + 1), typeSel, targetSel, body,
    h("div", { class: "row", style: "flex-wrap:nowrap" },
      h("button", { title: "위로", onclick: () => move(-1), disabled: i === 0 }, "↑"),
      h("button", { title: "아래로", onclick: () => move(1), disabled: i === f.steps.length - 1 }, "↓"),
      h("button", { class: "danger", title: "삭제", onclick: () => { f.steps.splice(i, 1); changed(); } }, "✕")));
}

// ------------------------------------------------------------------ apply
const ACTION_LABELS = { remove: "창 닫기", add: "창 추가", restart: "재시작 (인수인계 후)", fresh: "재시작 (인수인계 없이)", notify: "agent에 알리기",
  ack: "확인", skip: "건너뛰기" };
async function refreshChanges(show) {
  try {
    const res = await api("GET", "/api/project/" + encodeURIComponent(S.project) + "/changes");
    S.running = res.running; S.pending = res.changes;
    renderHeader();
    if (show && S.pending.length) showApply();
  } catch (e) { toast("변경 확인 실패: " + e.message); }
}
function showApply() {
  const dlg = $("applyDialog");
  const selects = {};
  $("applyList").replaceChildren(h("table", {}, h("tbody", {}, S.pending.map((c) => {
    const opts = c.actions.includes("skip") ? c.actions : c.actions.concat(["skip"]);
    selects[c.name] = h("select", { "aria-label": c.name + " 조치" },
      opts.map((a, i) => h("option", { value: a, selected: i === 0 }, ACTION_LABELS[a] || a)));
    return h("tr", {}, h("td", {}, h("b", {}, c.name)), h("td", { class: "small" }, c.detail), h("td", {}, selects[c.name]));
  }))));
  $("applyLater").onclick = () => dlg.close();
  $("applyNow").onclick = async () => {
    const actions = Object.fromEntries(Object.entries(selects).map(([n, sel]) => [n, sel.value]));
    $("applyNow").disabled = true; $("applyNow").textContent = "반영 중…";
    try {
      const res = await api("POST", "/api/project/" + encodeURIComponent(S.project) + "/apply", { actions });
      S.pending = res.changes;
      dlg.close();
      toast((res.results.length ? res.results.join(" · ") : "반영할 것이 없었습니다")
        + (S.pending.length ? " — 남은 변경 " + S.pending.length + "건" : ""));
      renderHeader();
    } catch (e) { toast(e.message); }
    finally { $("applyNow").disabled = false; $("applyNow").textContent = "지금 반영"; }
  };
  dlg.showModal();
}

// ------------------------------------------------------------------- roles
async function editRole(name) {
  if (dirty() || !S.exists) { toast("먼저 저장하세요 (역할 상세는 저장된 설정의 agent에만 쓸 수 있습니다)"); return; }
  try {
    const r = await api("GET", "/api/project/" + encodeURIComponent(S.project) + "/role/" + encodeURIComponent(name));
    $("roleTitle").textContent = "역할: " + name;
    $("roleOne").value = r.one; $("roleDetail").value = r.detail;
    const dlg = $("roleDialog");
    $("roleCancel").onclick = () => dlg.close();
    $("roleSave").onclick = async () => {
      try {
        await api("PUT", "/api/project/" + encodeURIComponent(S.project) + "/role/" + encodeURIComponent(name),
          { one: $("roleOne").value, detail: $("roleDetail").value });
        dlg.close();
        toast("역할을 저장했습니다.");
        if (S.running) refreshChanges(true);
      } catch (e) { toast(e.message); }
    };
    dlg.showModal();
  } catch (e) { toast(e.message); }
}

boot();
</script>
